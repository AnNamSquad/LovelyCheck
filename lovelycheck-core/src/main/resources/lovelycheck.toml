[config.settings]
# Connection-detection language block in this file.
language = "english"

# Enable logging of all CustomPayload packets for debugging purposes.
debug = false

# If the same payload is sent twice, only the first triggers a check.
skip_duplicates = false

# Automatically download required dependencies if they are not installed.
# Can also be disabled via JVM property:
# -Dlovelycheck.autoDownloadDependencies=false
auto_download_dependencies = true

# Delay in ticks before executing connection-detection actions.
action_delay_ticks = 20

[config.join_webhook]
enabled = false
url = ""
content = ""
embed_title = "Player Joined"
embed_description = "Player {player} has joined the server."
embed_color = 65280
embed_footer = "lovelycheck"

[messages.english.general]
prefix = "<gradient:#2F80ED:#FFCAC9>lovelycheck <#282B3F>| "

[messages.english.logs]
loaded = "<prefix><#55ffa4>Successfully enabled"
debug_message = "<#93291E>LC-Debug <#282B3F>| <#facc43><player> <#b8bbc2>channel<#6f737d>: \"<#facc43><channel><#6f737d>\", <#b8bbc2>message<#6f737d>: \"<#facc43><message><#6f737d>\""

[messages.english.commands]
help = """
<prefix><#b8bbc2>Available commands
<#6f737d>/lc <#b8bbc2>reload <#6f737d>-><#b8bbc2> reload the plugin<reset>
<#6f737d>/lc <#b8bbc2>check <#43c9fa>target <#6f737d>-><#b8bbc2> check player detected mods<reset>
<#6f737d>/lc <#b8bbc2>list <#6f737d>-><#b8bbc2> list all spotted players<reset>
"""
help_spigot = """
<prefix><#b8bbc2>Available commands
<#6f737d>/lc <#b8bbc2>reload <#6f737d>-><#b8bbc2> reload the plugin<reset>
<#6f737d>/lc <#b8bbc2>check <#43c9fa>target <#6f737d>-><#b8bbc2> check player detected mods<reset>
<#6f737d>/lc <#b8bbc2>list <#6f737d>-><#b8bbc2> list all spotted players<reset>
"""
reload_success = "<prefix><#55ffa4>Successfully reloaded"
check_no_mods = "<prefix><#55ffa4> No mods detected"
check_mods = "<prefix><#55ffa4> Detected mods:"
mod_list_format = "<#6f737d>- <#facc43><mod>"
check_lunar_mods = "<prefix><#55ffa4> Lunar Client mods:"
check_lunar_no_mods = "<prefix><#55ffa4> No Lunar Client mods detected"
lunar_mod_list_format = "<#6f737d>- <#facc43><mod>"
check_forge_mods = "<prefix><#55ffa4> Forge/NeoForge mods:"
check_forge_no_mods = "<prefix><#55ffa4> No Forge mods detected"
forge_mod_list_format = "<#6f737d>- <mod>"
check_players = "<prefix><#55ffa4> Spotted players:"
check_players_empty = "<prefix><#55ffa4> No players spotted"
player_list_format = "<#6f737d>- <#facc43><player>"

[actions.alert]
send_alert = "<red><player> <gray>just logged in using <red><name><gray> !"

[actions.alert.commands]
console = []
player = []
opped_player = []

# Example kick action:
# [actions.kick]
# send_alert = "<red><player> <gray>was kicked for using <red><name><gray> !"
# [actions.kick.commands]
# console = ["kick <player> You are not allowed to use <name>"]

