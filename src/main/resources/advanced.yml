lunar:
  # Lunar Client Apollo handshake settings.
  enabled: true

  settings:
    mark-lunar-client: true
    mark-fabric: true
    mark-forge: true
    show-mods-in-check: true
    show-mod-versions: false
    show-mod-types: false

  actions:
    lunar-client: []
    fabric: []
    forge: []

  mod-actions:
    tweakeroo: [alert]

forge:
  # Forge / NeoForge / Fabric mod-list settings.
  enabled: true

  settings:
    mark-forge: true
    mark-neoforge: true
    show-mods-in-check: true
    show-mod-versions: false

  actions:
    forge: []
    neoforge: []

  mod-actions:
    inventoryprofilesnext: [alert]
    tweakeroo: [alert]

  category:
    whitelisted:
      color: "<green>"
      mods:
        - betterfoliage
        - sodium
        - iris
        - optifine
        - rubidium
        - oculus
        - embeddium

    blacklisted:
      color: "<red>"
      mods:
        - forgewurst
        - forgehax
        - wurst
        - baritone
        - meteor
        - meteor-client
        - inventoryprofilesnext
        - aristois
        - impact
        - tweakeroo

  spoofing:
    enabled: true
    actions: [alert]

bedrock:
  # Bedrock integration for the connection-detection layer.
  enabled: false
  label: "Bedrock"
  actions: []

probing:
  # Optional legacy core sign probing. Most servers should use config.yml sign checks instead.
  enabled: false

  settings:
    delay-ticks: 40
    sign-offset-y: -5

  checks:
    meteor_client:
      name: "Meteor Client"
      translation-key: "key.meteor-client.open-gui"
      mode: keybind
      actions: [alert]

    wurst:
      name: "Wurst Client"
      translation-key: "key.wurst.zoom"
      actions: [alert]

    freecam:
      name: "Freecam"
      translation-key: "key.freecam.toggle"
      actions: [alert]

    tweakeroo:
      name: "Tweakeroo"
      translation-key: "tweakeroo.config.hotkey.name.openConfigGui"
      actions: [alert]
