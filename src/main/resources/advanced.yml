# LovelyCheck advanced connection-detection config.
# Most servers only need config.yml. Edit this file when you want to tune
# login-time payload, brand, Forge, Lunar, Bedrock, or generic channel checks.

settings:
  # Message language block below.
  language: english

  # Log all CustomPayload packets. Useful only while debugging detections.
  debug: false

  # If the same payload is sent twice, only the first one triggers a check.
  skip-duplicates: false

  # Automatically download required dependencies if they are not installed.
  # Can also be disabled via JVM property:
  # -Dlovelycheck.autoDownloadDependencies=false
  auto-download-dependencies: true

  # Delay in ticks before executing connection-detection actions.
  action-delay-ticks: 20

join-webhook:
  enabled: false
  url: ""
  content: ""
  embed-title: "Player Joined"
  embed-description: "Player {player} has joined the server."
  embed-color: 65280
  embed-footer: "lovelycheck"

messages:
  english:
    general:
      prefix: "<gradient:#2F80ED:#FFCAC9>lovelycheck <#282B3F>| "

    logs:
      loaded: "<prefix><#55ffa4>Successfully enabled"
      debug-message: "<#93291E>LC-Debug <#282B3F>| <#facc43><player> <#b8bbc2>channel<#6f737d>: \"<#facc43><channel><#6f737d>\", <#b8bbc2>message<#6f737d>: \"<#facc43><message><#6f737d>\""

    commands:
      help: |-
        <prefix><#b8bbc2>Available commands
        <#6f737d>/lc <#b8bbc2>reload <#6f737d>-><#b8bbc2> reload the plugin<reset>
        <#6f737d>/lc <#b8bbc2>check <#43c9fa>target <#6f737d>-><#b8bbc2> check player detected mods<reset>
        <#6f737d>/lc <#b8bbc2>list <#6f737d>-><#b8bbc2> list all spotted players<reset>
      help-spigot: |-
        <prefix><#b8bbc2>Available commands
        <#6f737d>/lc <#b8bbc2>reload <#6f737d>-><#b8bbc2> reload the plugin<reset>
        <#6f737d>/lc <#b8bbc2>check <#43c9fa>target <#6f737d>-><#b8bbc2> check player detected mods<reset>
        <#6f737d>/lc <#b8bbc2>list <#6f737d>-><#b8bbc2> list all spotted players<reset>
      reload-success: "<prefix><#55ffa4>Successfully reloaded"
      check-no-mods: "<prefix><#55ffa4> No mods detected"
      check-mods: "<prefix><#55ffa4> Detected mods:"
      mod-list-format: "<#6f737d>- <#facc43><mod>"
      check-lunar-mods: "<prefix><#55ffa4> Lunar Client mods:"
      check-lunar-no-mods: "<prefix><#55ffa4> No Lunar Client mods detected"
      lunar-mod-list-format: "<#6f737d>- <#facc43><mod>"
      check-forge-mods: "<prefix><#55ffa4> Forge/NeoForge mods:"
      check-forge-no-mods: "<prefix><#55ffa4> No Forge mods detected"
      forge-mod-list-format: "<#6f737d>- <mod>"
      check-players: "<prefix><#55ffa4> Spotted players:"
      check-players-empty: "<prefix><#55ffa4> No players spotted"
      player-list-format: "<#6f737d>- <#facc43><player>"

actions:
  # Actions are reusable responses. Checks below reference them by ID.
  alert:
    send-alert: "<red><player> <gray>just logged in using <red><name><gray> !"
    commands:
      console: []
      player: []
      opped-player: []

  # Example kick action:
  # kick:
  #   send-alert: "<red><player> <gray>was kicked for using <red><name><gray> !"
  #   commands:
  #     console:
  #       - "kick <player> You are not allowed to use <name>"

