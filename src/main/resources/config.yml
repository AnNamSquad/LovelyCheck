# LovelyCheck sign-probe config.
# This file is the main server-owner config for active sign translation scans.
# Connection-time payload checks are configured in advanced.yml.

general:
  prefix: "<yellow>[lovelycheck] <gray>"
  language: "en"
  silent-check: false

alerts:
  default-enabled: true

bedrock:
  # Bedrock clients cannot answer Java translation/keybind sign probes reliably.
  enabled: true
  prefixes:
    - "."
    - "*"

engine:
  # Main timeout for each sign batch. 200 ticks = 10 seconds.
  timeout-ticks: 200

  # Delay between sign batches. 20 ticks = 1 second.
  batch-interval-ticks: 20

  # First-probe timeout floor. This prevents high-ping players from being
  # classified too early before the first response can arrive.
  first-probe:
    timeout-ticks: 20
    buffer-ticks: 20

  confirmation:
    # Direct DETECTED results must be seen twice before alerts/punishment.
    enabled: true

  translation-masking:
    # Detect clients that make configured mod probes look vanilla while
    # connection-time evidence already matched the same configured mod.
    enabled: true
    minimum-checks: 1
    punishable: false
    display-name: "Translation Masking Bypass"

scans:
  manual:
    # Used by /lovelychecker scan <player> when no fingerprint list is supplied.
    fingerprints:
      - meteor-client
      - liquidbounce
      - vape
      - freecam
      - wurst
      - xray-fabric
      - chestesp
      - killaura-fabric
      - autofish
      - autototem
      - autototem-meteor
      - lumina
      - autoswitch
      - bleachhack
      - aristois
      - coffee
      - world-downloader
      - item-scroller
      - xaeros-minimap
      - journeymap
      - autoclicker-fabric
      - antiafk
      - auto-clicker-mc
      - inventory-profiles-next
      - tweakeroo

  join:
    enabled: false
    only-first-join: false
    delay-ticks: 100
    fingerprints:
      - meteor-client
      - liquidbounce
      - vape
      - freecam
      - wurst
      - xray-fabric
      - chestesp
      - killaura-fabric
      - autofish
      - autototem
      - autototem-meteor
      - lumina
      - autoswitch
      - bleachhack
      - aristois
      - coffee
      - world-downloader
      - item-scroller
      - xaeros-minimap
      - journeymap
      - autoclicker-fabric
      - antiafk
      - auto-clicker-mc
      - inventory-profiles-next
      - tweakeroo

  anticheat:
    enabled: false
    cooldown-hours: 24
    integrations:
      grim: true
      vulcan: true
      spartan: true
    fingerprints:
      - meteor-client
      - liquidbounce
      - vape
      - freecam
      - wurst
      - xray-fabric
      - chestesp
      - killaura-fabric
      - autofish
      - autototem
      - autototem-meteor
      - lumina
      - autoswitch
      - bleachhack
      - aristois
      - coffee
      - world-downloader
      - item-scroller
      - xaeros-minimap
      - journeymap
      - autoclicker-fabric
      - antiafk
      - auto-clicker-mc
      - inventory-profiles-next
      - tweakeroo

enforcement:
  punishment:
    enabled: false
    kick-first: true
    kick-command: "kick %player% %reason%"
    command: "tempban %player% %duration% %reason%"
    reason: "Unallowed client/mod: %detections%"
    durations:
      1: "15m"
      2: "30m"
      3: "1d"
      4: "3d"
      5: "30d"

  commands:
    detected:
      enabled: false
      command: "tempban %player% 14d Cheating"
    protected:
      enabled: false
      command: "tempban %player% 14d Cheating"
    clean:
      enabled: false
      command: "give %player% diamond 1"

webhooks:
  detection:
    enabled: false
    url: "https://discord.com/api/webhooks/CHANGE_ME"
    embed-color: 16776960
    message: "**Player:** &name&\n**Checked by:** &checker&\n**Reason:** &reason&\n**Hacks checked:** &hacks&\n**Results:**\n&results&"
  locale:
    url: "https://discord.com/api/webhooks/CHANGE_ME"
    embed-color: 8355711

messages:
  no-permission: "{prefix}<red>You don't have permission to do this."
  player-not-found: "{prefix}<red>Player <white>{player} <red>not found."
  already-checking: "{prefix}<yellow>{player} <white>is already being checked."
  check-started: "{prefix}<white>Starting check on <yellow>{player}<white>..."
  check-complete: "{prefix}<white>Check complete for <yellow>{player}<white>:"
  check-timeout: "{prefix}<yellow>{player} <white>did not respond - marked as <gray>SKIPPED<white>."
  reload-done: "{prefix}<green>Configuration reloaded."
  anticheat-trigger: "{prefix}<gray>Anticheat flagged <yellow>{player}<gray>. Queuing auto-check..."
  join-check: "{prefix}<gray>Auto-checking <yellow>{player} <gray>on join..."
  invalid-hack: "{prefix}<red>Unknown hack: <white>{hack}"
  bedrock-skip: "{prefix}<yellow>{player} <gray>is a Bedrock player - scan skipped."
  alerts-enabled: "{prefix}<green>Alerts enabled."
  alerts-disabled: "{prefix}<red>Alerts disabled."

fingerprints:
  # mode:
  #   TRANSLATE = translation key should return fallback/raw key on vanilla clients
  #   KEYBIND   = keybind should return raw key on vanilla clients
  #   METEOR    = legacy custom Meteor behavior
  # bypass-protection wraps the probe in a "%s" component to evade clients
  # that try to strip direct sign translation keys.
  meteor-client:
    label: "Meteor Client (Fabric)"
    key: "key.meteor-client.open-gui"
    mode: KEYBIND
    bypass-protection: true

  liquidbounce:
    label: "LiquidBounce"
    key: "liquidbounce.module.killaura.name"
    mode: TRANSLATE

  vape:
    label: "Vape"
    key: "key.vape.open_gui"
    mode: KEYBIND

  freecam:
    label: "Freecam"
    key: "key.freecam.toggle"
    mode: KEYBIND

  wurst:
    label: "Wurst Client (-1.21)"
    key: "key.wurst.zoom"
    mode: KEYBIND

  xray-fabric:
    label: "XRay (Fabric)"
    key: "xray.config.toggle"
    mode: KEYBIND

  chestesp:
    label: "ChestESP"
    key: "key.chestesp.toggle"
    mode: KEYBIND

  killaura-fabric:
    label: "KillAura (Fabric)"
    key: "key.killaura"
    mode: KEYBIND

  autofish:
    label: "AutoFish"
    key: "key.autofish.open_gui"
    mode: KEYBIND

  autototem:
    label: "AutoTotem"
    key: "key.autototem.toggle"
    mode: KEYBIND

  autototem-meteor:
    label: "AutoTotem (Meteor)"
    key: "module.meteor-client.auto-totem"
    mode: TRANSLATE
    bypass-protection: true

  lumina:
    label: "Lumina"
    key: "key.lumina.open_click_gui"
    mode: KEYBIND

  autoswitch:
    label: "AutoSwitch"
    key: "key.autoswitch.toggle"
    mode: KEYBIND

  bleachhack:
    label: "BleachHack"
    key: "bleachhack.module.killaura"
    mode: TRANSLATE

  aristois:
    label: "Aristois"
    key: "emc.module.killaura.name"
    mode: TRANSLATE

  coffee:
    label: "Coffee Client"
    key: "coffee.module.killaura.name"
    mode: TRANSLATE

  world-downloader:
    label: "World Downloader"
    key: "key.wdl.startStop"
    mode: TRANSLATE

  item-scroller:
    label: "Item Scroller"
    key: "itemscroller.hotkeys.category"
    mode: TRANSLATE

  xaeros-minimap:
    label: "Xaero's Minimap"
    key: "gui.xaero_minimap_settings"
    mode: TRANSLATE

  journeymap:
    label: "JourneyMap"
    key: "key.journeymap.fullscreen"
    mode: KEYBIND

  autoclicker-fabric:
    label: "AutoClicker (Fabric)"
    key: "autoclicker-fabric.hud.holding"
    mode: TRANSLATE

  antiafk:
    label: "AntiAFK"
    key: "key.antiafk.toggle"
    mode: TRANSLATE

  auto-clicker-mc:
    label: "Auto Clicker (p1k0chu)"
    key: "key.auto-clicker_.toggle"
    mode: KEYBIND

  inventory-profiles-next:
    label: "Inventory Profiles Next"
    key: "inventoryprofiles.config.name.open_config_menu"
    mode: TRANSLATE

  tweakeroo:
    label: "Tweakeroo"
    key: "tweakeroo.config.hotkey.name.openConfigGui"
    mode: TRANSLATE
